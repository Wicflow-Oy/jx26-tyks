<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>Prototype · synthetic data</title>
    <!-- no favicon request (and no 404 in the console); the tab shows the page title -->
    <link rel="icon" href="data:," />
    <link rel="preload" href="fonts/Inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/replay.css" />
    <link rel="stylesheet" href="css/brief.css" />
    <link rel="stylesheet" href="css/case.css" />
    <link rel="stylesheet" href="css/ward.css" />
    <link rel="stylesheet" href="css/ehr.css" />
    <link rel="stylesheet" href="css/order-layer.css" />
    <link rel="stylesheet" href="css/tour.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="wash" aria-hidden="true"></div>

    <!-- Desktop toolbar and replay rail (>=1024). Tab order: skip link, role switch, stepper, tour, rail, content, sidebar. -->
    <header class="toolbar" id="toolbar"></header>
    <section class="rail" id="rail" aria-label="Replay"></section>

    <main class="main" id="main" tabindex="-1">
      <div class="col">
        <!-- Phone and tablet top bar and role switch (<1024) -->
        <div class="mtop" id="mtop"></div>
        <div class="m-role m-only" id="m-role"></div>
        <section id="view" aria-labelledby="view-title">
          <noscript><p>This prototype needs JavaScript.</p></noscript>
        </section>
      </div>
    </main>

    <nav class="sidebar" id="sidebar"></nav>
    <aside class="pane" id="pane"></aside>
    <nav class="tabbar" id="tabbar"></nav>

    <div class="scrim" id="scrim"></div>
    <div class="replay-sheet" id="replay-sheet" role="dialog" aria-modal="true"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
    <div class="menu" id="menu" role="menu"></div>
    <div class="tour" id="tour" role="dialog" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="sr" id="live" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
