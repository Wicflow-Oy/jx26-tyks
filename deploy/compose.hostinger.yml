# Wicflow's Hostinger host (since 18.11.2026; DEPLOY.md "Wicflow's host: Hostinger"). Use with compose.yml + compose.traefik.yml:
#   docker compose --env-file .env -f deploy/compose.yml -f deploy/compose.traefik.yml -f deploy/compose.hostinger.yml up -d --build
# Keeps what the earlier host's Caddy did: a 64 KB request body limit, gzip, and /technical (../tech) served by nginx.
services:
  tyks:
    labels:
      - "traefik.http.middlewares.jx-tyks-body.buffering.maxRequestBodyBytes=65536"
      - "traefik.http.middlewares.jx-tyks-gzip.compress=true"
      - "traefik.http.routers.jx-tyks.middlewares=jx-tyks-headers,jx-tyks-body,jx-tyks-gzip"
  tech:
    image: nginx:alpine
    container_name: jx-tyks-tech
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    volumes:
      - ../tech:/usr/share/nginx/html/technical:ro
      - ./tech-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:?set TRAEFIK_NETWORK in .env}"
      - "traefik.http.routers.jx-tyks-tech.rule=Host(`${TYKS_HOST:?set TYKS_HOST in .env}`) && (Path(`/technical`) || PathPrefix(`/technical/`))"
      - "traefik.http.routers.jx-tyks-tech.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.jx-tyks-tech.tls.certresolver=${TYKS_CERTRESOLVER:?set TYKS_CERTRESOLVER in .env}"
      # Its own middlewares, so /technical keeps working while the app container restarts.
      - "traefik.http.middlewares.jx-tyks-tech-headers.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow"
      - "traefik.http.middlewares.jx-tyks-tech-headers.headers.referrerPolicy=no-referrer"
      - "traefik.http.middlewares.jx-tyks-tech-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.jx-tyks-tech-gzip.compress=true"
      - "traefik.http.routers.jx-tyks-tech.middlewares=jx-tyks-tech-headers,jx-tyks-tech-gzip"
      - "traefik.http.services.jx-tyks-tech.loadbalancer.server.port=80"
