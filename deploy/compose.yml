# Strainwatch public demo: base service. Compose project: jx-tyks. Operator guide: ../DEPLOY.md.
# Always combine with ONE proxy file:
#   Traefik:      -f deploy/compose.yml -f deploy/compose.traefik.yml
#   Caddy/nginx:  -f deploy/compose.yml -f deploy/compose.port.yml
# Commands act only on project jx-tyks. The image's Dockerfile sets the app defaults and the healthcheck.
name: jx-tyks

services:
  tyks:
    build:
      context: ..
      dockerfile: Dockerfile
    image: jx-tyks:${TYKS_TAG:-live}
    container_name: jx-tyks
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Secrets live only on the box (/opt/jx/tyks/.env, chmod 600, never in git).
    env_file:
      - path: ../.env
        required: true
    volumes:
      # The synthetic dataset (6 CSVs), copied to the box separately; never in git or in the image.
      - ${TYKS_DATA_DIR:-../data}:/app/data:ro
      # Precomputed caches survive restarts; safe to delete (they rebuild at start).
      - tyks-cache:/app/cache

volumes:
  tyks-cache:
